<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Panel — as-visa.com</title></head>
<body>
<!-- Kaydedilen gerçek panel DOM'undan alınan bölüm (randevu yok durumu) -->
<div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-5 sm:p-8">
  <h1>RANDEVU SİSTEMİ</h1>
  <p>Vize başvurunuz için randevu oluşturun</p>

  <div class="mb-2 flex items-end justify-between">
    <span class="text-sm font-semibold text-gray-800">Ofis</span>
    <span class="text-xs font-medium text-gray-400">4 / 8</span>
  </div>

  <button type="button">Geri</button>
  <h2 class="text-xl font-semibold text-gray-800">Başvuru Merkezini Seçin</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="flex flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-gray-200 bg-gray-50/70 px-4 py-10 text-center col-span-full">
      <div class="flex h-11 w-11 items-center justify-center rounded-full bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-inbox h-5 w-5 text-gray-400" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      </div>
      <p class="text-sm font-medium text-gray-500">Uygun Randevu Bulunmamaktadır.</p>
    </div>
  </div>
</div>
</body>
</html>
