<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; padding: 14px; background: #14161a; color: #e7e9ee; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .dot.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .k { color: #9aa3b2; }
  .v { text-align: right; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: #22c55e; } .warn { color: #f59e0b; } .bad { color: #ef4444; }
  .btns { display: flex; gap: 8px; margin: 12px 0 4px; }
  button { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a; background: #1d2129; color: #e7e9ee; cursor: pointer; font: inherit; }
  button:hover { background: #252b35; }
  button.primary { background: #f97316; border-color: #f97316; color: #14161a; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  hr { border: 0; border-top: 1px solid #222732; margin: 12px 0; }
  label { display: block; color: #9aa3b2; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 8px; border: 1px solid #2a2f3a; background: #1a1e25; color: #e7e9ee; font: inherit; }
  .hint { color: #6b7280; font-size: 11px; margin-top: 6px; }
  a { color: #93c5fd; }
  details { margin-top: 8px; } summary { cursor: pointer; color: #9aa3b2; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #9aa3b2; max-height: 110px; overflow: auto; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> AS Visa Nöbetçi</h1>

  <div class="row"><span class="k">Durum</span><span class="v" id="status">—</span></div>
  <div class="row"><span class="k">Son kontrol</span><span class="v" id="last">—</span></div>
  <div class="row"><span class="k">Adım</span><span class="v" id="step">—</span></div>
  <div class="row"><span class="k">Sonraki</span><span class="v" id="next">—</span></div>
  <div class="row"><span class="k">Kalan süre</span><span class="v" id="left">—</span></div>
  <div class="row"><span class="k">Detay</span><span class="v" id="detail">—</span></div>

  <div class="btns">
    <button class="primary" id="start">3 günlük nöbeti başlat</button>
    <button id="check">Şimdi kontrol et</button>
  </div>
  <div class="btns">
    <button id="stop">Durdur</button>
    <button id="open">Sayfayı aç</button>
  </div>

  <hr />
  <label for="tok">Telegram bot token (opsiyonel)</label>
  <input id="tok" placeholder="123456:ABC-DEF..." autocomplete="off" />
  <label for="chat">Telegram chat id</label>
  <input id="chat" placeholder="örn. 123456789" autocomplete="off" />
  <div class="btns"><button id="save">Kaydet</button><button id="test">Test mesajı</button></div>
  <div class="hint">Bildirimler bilgisayarda da görünür. Telegram, evde değilken işine yarar.</div>

  <details>
    <summary>Son API teşhisi</summary>
    <pre id="diag">—</pre>
    <div class="btns"><button id="copy">Teşhisi kopyala</button></div>
  </details>

<script src="popup.js"></script>
</body>
</html>
